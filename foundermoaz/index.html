<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rovity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --ink: #ece8e1;
    --muted: #8f8d89;
    --card: #161616;
    --border: #262626;
    --accent: #ece8e1;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .page {
    min-height: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 44px 22px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-size: 36px; font-weight: 800; letter-spacing: -0.02em;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 { margin-top: 24px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; text-align: center; }
  .sub { margin-top: 8px; font-size: 16px; color: var(--muted); text-align: center; }
  .sub:empty { display: none; }

  .socials { display: flex; gap: 14px; margin: 26px 0 28px; }
  .socials:empty { display: none; }
  .chip {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    display: grid; place-items: center; color: var(--ink);
  }
  .chip svg { width: 22px; height: 22px; }

  .links { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
  .btn {
    display: flex; align-items: center; gap: 14px;
    min-height: 62px; padding: 0 22px;
    border-radius: 20px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--ink); text-decoration: none;
    font-size: 17px; font-weight: 500;
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn svg.ico { width: 22px; height: 22px; flex: none; }
  .btn .label { flex: 1; }
  .btn .arrow { font-size: 22px; font-weight: 300; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
  .chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  footer { margin-top: auto; padding-top: 56px; text-align: center; color: var(--muted); font-size: 14px; }
  .wordmark { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-size: 24px; font-weight: 800; letter-spacing: -0.04em; }
  .wordmark svg { width: 17px; height: 17px; }
  footer p { margin-top: 2px; }
</style>
</head>
<body>

<main class="page" id="page">
  <noscript>Please turn on JavaScript to see this page.</noscript>
</main>

<script>
/* ============================================================
   EDIT ONLY THIS BLOCK FOR EACH CLIENT.
   Leave a value as "" and its button or icon disappears.
   ============================================================ */
const CLIENT = {
  name:      "Moaz Hisham",
  initials:  "MH",                       // leave "" to build them from the name
  tagline:   "Founder Rovity",
  photo:     "moazbasha.jpg",                       // e.g. "photo.jpg" (file in the same folder), or ""

  whatsapp:  "201122094956",           // country code, no + and no leading 0
  phone:     "+201122094956",          // international format, with +
  email:     "moazhisham00@gmail.com",
  linkedin:  "https://www.linkedin.com/in/moaz-hisham-72a232371?utm_source=share_via&utm_content=profile&utm_medium=member_android",

  instagram: "https://instagram.com/moa1zz",
  facebook:  "https://www.facebook.com/share/1CCrqGt2US/",
  tiktok:    "https://tiktok.com/@moa3z_hisham"
};
/* ============================================================ */

const ICONS = {
  whatsapp: '<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.5 8.5 0 1 1 21 11.5z"/>',
  phone:    '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  email:    '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 7l9 6 9-6"/>',
  linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
  instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>',
  facebook: '<path d="M14 8h2.5V4.5H14C11.8 4.5 10 6.3 10 8.5V11H7.5v3.5H10V21h3.5v-6.5H16L16.5 11h-3V8.8c0-.5.2-.8.5-.8z"/>',
  tiktok:   '<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.3 2.4 1.9 4.2 4.5 4.5"/>'
};
const NS = "http://www.w3.org/2000/svg";

function svg(name, cls) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.8");
  s.setAttribute("stroke-linecap", "round");
  s.setAttribute("stroke-linejoin", "round");
  if (cls) s.setAttribute("class", cls);
  s.innerHTML = ICONS[name];
  return s;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}
const clean = v => (v || "").trim();
const digits = v => clean(v).replace(/[^\d]/g, "");
const safeUrl = v => /^https?:\/\//i.test(clean(v)) ? clean(v) : "";

function initialsOf(name) {
  return clean(name).split(/\s+/).filter(Boolean).slice(0, 2)
    .map(w => w[0]).join("").toUpperCase();
}

function build() {
  const c = CLIENT;
  const page = document.getElementById("page");
  page.textContent = "";

  document.title = clean(c.name) || "Rovity";

  /* avatar */
  const avatar = el("div", "avatar");
  if (clean(c.photo)) {
    const img = el("img");
    img.src = clean(c.photo);
    img.alt = clean(c.name);
    img.onerror = () => { avatar.textContent = clean(c.initials) || initialsOf(c.name); };
    avatar.appendChild(img);
  } else {
    avatar.textContent = clean(c.initials) || initialsOf(c.name);
    avatar.setAttribute("aria-hidden", "true");
  }
  page.appendChild(avatar);

  page.appendChild(el("h1", "", clean(c.name)));
  page.appendChild(el("p", "sub", clean(c.tagline)));

  /* social icons */
  const socials = el("nav", "socials");
  socials.setAttribute("aria-label", "Social media");
  [["instagram", "Instagram"], ["facebook", "Facebook"], ["tiktok", "TikTok"]].forEach(([key, label]) => {
    const url = safeUrl(c[key]);
    if (!url) return;
    const a = el("a", "chip");
    a.href = url; a.target = "_blank"; a.rel = "noopener";
    a.setAttribute("aria-label", label);
    a.appendChild(svg(key));
    socials.appendChild(a);
  });
  page.appendChild(socials);

  /* buttons */
  const links = el("section", "links");
  links.setAttribute("aria-label", "Links");
  const buttons = [];
  if (digits(c.whatsapp)) buttons.push({ key: "whatsapp", label: "Message on WhatsApp", href: "https://wa.me/" + digits(c.whatsapp), ext: true, primary: true });
  if (digits(c.phone))    buttons.push({ key: "phone",    label: "Call me",             href: "tel:+" + digits(c.phone) });
  if (clean(c.email))     buttons.push({ key: "email",    label: "Send an email",       href: "mailto:" + clean(c.email) });
  if (safeUrl(c.linkedin))buttons.push({ key: "linkedin", label: "Connect on LinkedIn", href: safeUrl(c.linkedin), ext: true });

  buttons.forEach(b => {
    const a = el("a", "btn" + (b.primary ? " primary" : ""));
    a.href = b.href;
    if (b.ext) { a.target = "_blank"; a.rel = "noopener"; }
    a.appendChild(svg(b.key, "ico"));
    a.appendChild(el("span", "label", b.label));
    a.appendChild(el("span", "arrow", "→"));
    links.appendChild(a);
  });
  page.appendChild(links);

  /* footer */
  const footer = el("footer");
  const mark = el("span", "wordmark", "Rovity");
  const waves = document.createElementNS(NS, "svg");
  waves.setAttribute("viewBox", "0 0 24 24");
  waves.setAttribute("fill", "none");
  waves.setAttribute("stroke", "currentColor");
  waves.setAttribute("stroke-width", "2.6");
  waves.setAttribute("stroke-linecap", "round");
  waves.innerHTML = '<path d="M3 9.5a3 3 0 0 1 0 5"/><path d="M8 7a6 6 0 0 1 0 10"/><path d="M13 4a10 10 0 0 1 0 16"/>';
  mark.appendChild(waves);
  footer.appendChild(mark);
  footer.appendChild(el("p", "", "made for what’s next"));
  page.appendChild(footer);
}
build();
</script>
</body>
</html>
