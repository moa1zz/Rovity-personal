<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name</title>
<meta name="description" content="A short line about you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --ink: #ece8e1;
    --muted: #8f8d89;
    --card: #161616;
    --border: #262626;
    --accent: #ece8e1;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .page {
    min-height: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 44px 22px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-size: 36px; font-weight: 800; letter-spacing: -0.02em;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 { margin-top: 24px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; text-align: center; }
  .sub { margin-top: 8px; font-size: 16px; color: var(--muted); text-align: center; }

  .socials { display: flex; gap: 14px; margin: 26px 0 28px; }
  .chip {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    display: grid; place-items: center; color: var(--ink);
  }
  .chip svg { width: 22px; height: 22px; }

  .links { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .btn {
    display: flex; align-items: center; gap: 14px;
    min-height: 62px; padding: 0 22px;
    border-radius: 20px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--ink); text-decoration: none;
    font-size: 17px; font-weight: 500;
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn svg.ico { width: 22px; height: 22px; flex: none; }
  .btn .label { flex: 1; }
  .btn .arrow { font-size: 22px; font-weight: 300; }
  .btn .note { font-size: 15px; color: var(--muted); font-weight: 400; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }

  .chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  footer { margin-top: auto; padding-top: 56px; text-align: center; color: var(--muted); font-size: 14px; }
  footer a { color: inherit; text-decoration: none; display: inline-block; }
  .wordmark { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-size: 24px; font-weight: 800; letter-spacing: -0.04em; }
  .wordmark svg { width: 17px; height: 17px; color: var(--ink); }
  footer p { margin-top: 2px; }
</style>
</head>
<body>
<main class="page">

  <!-- Photo: replace the initials with <img src="photo.jpg" alt="Your Name"> -->
  <div class="avatar" aria-hidden="true">YN</div>
  <h1>Your Name</h1>
  <p class="sub">A short line about you</p>

  <!-- Social icons: replace each href -->
  <nav class="socials" aria-label="Social media">
    <a class="chip" href="https://instagram.com/moa1zz" aria-label="Instagram" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
    </a>
    <a class="chip" href="https://facebook.com/yourname" aria-label="Facebook" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8h2.5V4.5H14C11.8 4.5 10 6.3 10 8.5V11H7.5v3.5H10V21h3.5v-6.5H16L16.5 11h-3V8.8c0-.5.2-.8.5-.8z"/></svg>
    </a>
    <a class="chip" href="https://tiktok.com/@yourname" aria-label="TikTok" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.3 2.4 1.9 4.2 4.5 4.5"/></svg>
    </a>
  </nav>

  <!-- Buttons: replace each href. Delete any block you don't need. -->
  <section class="links" aria-label="Links">

    <a class="btn primary" href="https://wa.me/201000000000" target="_blank" rel="noopener">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg>
      <span class="label">Message on WhatsApp</span><span class="arrow">→</span>
    </a>

    <a class="btn" href="tel:+201122094956">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      <span class="label">Save me as a contact</span><span class="arrow">→</span>
    </a>


    <a class="btn" href="mailto:you@example.com">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 7l9 6 9-6"/></svg>
      <span class="label">Send an email</span><span class="arrow">→</span>
    </a>

    <a class="btn" href="https://linkedin.com/in/yourname" target="_blank" rel="noopener">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      <span class="label">Connect on LinkedIn</span><span class="arrow">→</span>
    </a>

  </section>

  <footer>
    <a href="https://rovity.pages.dev" aria-label="Rovity">
      <span class="wordmark">Rovity
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M3 9.5a3 3 0 0 1 0 5"/><path d="M8 7a6 6 0 0 1 0 10"/><path d="M13 4a10 10 0 0 1 0 16"/></svg>
      </span>
      <p>made for what’s next</p>
    </a>
  </footer>

</main>
</body>
</html>
