<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Business Name</title>
<meta name="description" content="Reviews, payments, menu and socials for Your Business Name.">
<meta name="theme-color" content="#0c0c0d">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0d; --surface:#17191b; --circle:#1c1e20; --line:#2c2f32;
  --ink:#e9e4da; --mute:#8d8f92; --accent:#c9b9a5; --accent-ink:#17140f;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color-scheme:dark}
body{
  min-height:100dvh; color:var(--ink); background:var(--bg);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

.card{
  position:relative; overflow:hidden; width:100%; max-width:430px; margin:0 auto;
  min-height:100dvh; display:flex; flex-direction:column;
  padding:calc(56px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 60% at 50% 0%,#17191b 0%,var(--bg) 62%);
}
@media (min-width:480px){
  body{padding:24px}
  .card{
    min-height:min(860px,calc(100dvh - 48px)); border-radius:28px;
    border:1px solid #1f2123; padding-top:56px; padding-bottom:30px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
}

.watermark{
  position:absolute; top:20px; right:-24px; width:320px; height:auto;
  color:#fff; opacity:.035; pointer-events:none;
}

.head{position:relative; display:flex; flex-direction:column; align-items:center; text-align:center}
.logo{
  width:132px; height:132px; border-radius:50%; background:#101112;
  border:1.5px solid var(--accent); color:var(--accent);
  display:grid; place-items:center; overflow:hidden;
}
.logo svg{width:54px; height:auto}
.logo img{width:100%; height:100%; object-fit:cover}
.logo .initials{font-size:52px; font-weight:700; letter-spacing:-.02em; line-height:1}
h1{margin-top:26px; font-size:27px; font-weight:600; line-height:1.2}
.sub{margin-top:8px; font-size:14px; color:var(--mute)}

.socials{position:relative; display:flex; justify-content:center; gap:14px; margin-top:26px}
.social{
  width:50px; height:50px; border-radius:50%; background:var(--circle);
  display:grid; place-items:center;
}
.social svg{width:21px; height:21px}

.links{position:relative; display:grid; gap:12px; margin-top:30px}
.btn{
  display:flex; align-items:center; gap:16px; width:100%; min-height:62px; padding:0 20px;
  border-radius:18px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font:inherit; font-size:16px; font-weight:500; text-align:start; cursor:pointer;
}
.btn .icon{width:23px; height:23px; flex:none; color:var(--accent)}
.btn .chev{width:18px; height:18px; flex:none; color:var(--mute)}
.btn span{flex:1}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.btn.primary .icon,.btn.primary .chev{color:var(--accent-ink)}
.btn:active{transform:scale(.985)}
@media (hover:hover){
  .btn:hover{border-color:#44484c}
  .btn.primary:hover{filter:brightness(1.06)}
  .social:hover{background:#26292c}
}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

.foot{position:relative; margin-top:auto; padding-top:36px; display:grid; justify-items:center; gap:8px}
.mark{display:flex; align-items:center; gap:14px; width:100%}
.mark i{flex:1; height:1px; background:#2a2c2e}
.word{display:flex; align-items:center; gap:5px; font-size:23px; font-weight:700; letter-spacing:-.02em}
.word svg{width:16px; height:16px; color:var(--accent)}
.tag{font-size:10.5px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--mute)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
/* ============================================================
   عدّل هنا بس — كل بيانات المحل في البوكس ده
   أي حاجة تسيبها فاضية "" الزرار أو الأيقونة بتاعتها بتختفي
   ============================================================ */
const CLIENT = {
  name:      "Your Business Name",
  tagline:   "Café · Restaurant · Cairo, Egypt",
  logo:      "",   // صورة اللوجو: "logo.png" أو "/cafe-nile/logo.png" (لو فاضي بيظهر حرف R)
  initials:  "",   // حروف بدل اللوجو، مثلاً "CN" (بتظهر لو مفيش صورة)

  review:    "https://search.google.com/local/writereview?placeid=YOUR_PLACE_ID",
  instapay:  "https://ipn.eg/S/your.handle/instapay",
  menu:      "https://example.com/menu",
  website:   "https://example.com",

  instagram: "https://instagram.com/yourbusiness",
  facebook:  "https://facebook.com/yourbusiness",
  tiktok:    "https://tiktok.com/@yourbusiness"
};
</script>
</head>
<body>

<!-- Rovity R mark (reused for the logo and the watermark) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="r-mark" viewBox="60 60 710 730">
    <path fill="currentColor" d="M75 80H590C675 80 748 130 748 205V658L610 520Q600 508 603 490Q606 462 640 448Q668 436 665 380V310C665 240 620 190 545 190H235C205 190 190 185 175 175Z"/>
    <path fill="currentColor" d="M227.4 272.6A60 60 0 0 0 142.6 357.4L555 770H725Z"/>
  </symbol>
</svg>

<main class="card">
  <svg class="watermark" viewBox="60 60 710 730" aria-hidden="true"><use href="#r-mark"/></svg>

  <header class="head">
    <div class="logo" id="logo">
      <svg viewBox="60 60 710 730" role="img" aria-label="Logo"><use href="#r-mark"/></svg>
    </div>
    <h1 id="name"></h1>
    <p class="sub" id="tagline"></p>
  </header>

  <nav class="socials" id="socials" aria-label="Social media">
    <a class="social" data-link="instagram" data-blank aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg>
    </a>
    <a class="social" data-link="facebook" data-blank aria-label="Facebook">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.3H7.5v3H10V21h3.5z"/></svg>
    </a>
    <a class="social" data-link="tiktok" data-blank aria-label="TikTok">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 3h-3v12.3a2.5 2.5 0 1 1-2.5-2.5c.3 0 .5 0 .8.1V9.8a5.6 5.6 0 1 0 4.7 5.5V9.2a7.1 7.1 0 0 0 4.1 1.3V7.5A4.3 4.3 0 0 1 16.6 3z"/></svg>
    </a>
  </nav>

  <div class="links">
    <a class="btn primary" data-link="review" data-blank>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2.5 14.9 8.7 21.5 9.4 16.6 13.9 18 20.5 12 17.1 6 20.5 7.4 13.9 2.5 9.4 9.1 8.7"/></svg>
      <span>Leave us a review</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>
    <a class="btn" data-link="instapay">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>
      <span>Pay with InstaPay</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>
    <a class="btn" data-link="menu" data-blank>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      <span>Menu &amp; prices</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>
    <a class="btn" data-link="website" data-blank>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
      <span>Visit our website</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>
  </div>

  <footer class="foot">
    <div class="mark">
      <i></i>
      <div class="word">Rovity
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 8.5a5 5 0 0 1 0 7M11.5 6a8.5 8.5 0 0 1 0 12M15 3.5a12 12 0 0 1 0 17"/></svg>
      </div>
      <i></i>
    </div>
    <span class="tag">Made for what’s next.</span>
  </footer>
</main>

<script>
/* بيقرأ من CLIENT فوق ويملّا الصفحة — مفيش داعي تعدّل هنا */
(function () {
  var C = CLIENT;

  // الاسم والعنوان
  document.title = C.name || document.title;
  var desc = document.querySelector('meta[name="description"]');
  if (desc && C.name) desc.setAttribute('content', 'Reviews, payments, menu and socials for ' + C.name + '.');
  document.getElementById('name').textContent = C.name || '';
  var tag = document.getElementById('tagline');
  if (C.tagline) { tag.textContent = C.tagline; } else { tag.remove(); }

  // اللوجو: صورة، وإلا حروف، وإلا حرف R
  var logo = document.getElementById('logo');
  if (C.logo) {
    var img = document.createElement('img');
    img.src = C.logo; img.alt = (C.name || 'Business') + ' logo';
    logo.textContent = ''; logo.appendChild(img);
  } else if (C.initials) {
    var span = document.createElement('span');
    span.className = 'initials'; span.textContent = C.initials;
    logo.textContent = ''; logo.appendChild(span);
  }

  // الروابط: اللي فاضي بيتشال
  document.querySelectorAll('[data-link]').forEach(function (a) {
    var url = C[a.getAttribute('data-link')];
    if (!url) { a.remove(); return; }
    a.href = url;
    if (a.hasAttribute('data-blank')) { a.target = '_blank'; a.rel = 'noopener'; }
  });

  // لو مفيش ولا سوشيال، شيل الصف كله
  var socials = document.getElementById('socials');
  if (!socials.querySelector('.social')) socials.remove();
})();
</script>
</body>
</html>
